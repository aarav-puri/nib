<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nib</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div id="mainView">
      <!-- Header with Branding -->
      <header class="header">
        <div class="brand">
          <img class="brand-icon" src="icons/icon.svg" alt="">
          <h1 class="brand-title">Nib</h1>
        </div>

      <div class="tool-card" id="hiderCard" style="display: none;">
        <div class="tool-row">
          <div class="tool-info">
            <span class="tool-title">Answer Hider</span>
            <span class="tool-subtitle">Hides correct and incorrect markers</span>
            <span class="tool-note" id="hiderNote" style="display: none;"></span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="hiderToggle" aria-label="Answer Hider">
            <span class="toggle-track"></span>
          </label>
          <span class="tool-badge" id="hiderBadge" style="display: none;">Visible</span>
        </div>
      </div>
    </header>

    <!-- Error Card -->
    <div class="card card-error" id="errorCard" style="display: none;">
      <div class="card-header">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <h2 class="card-title">Error</h2>
      </div>
      <p class="error-text" id="errorText"></p>
    </div>

    <!-- Not AP Classroom Card -->
    <div class="card card-warning" id="notApCard" style="display: none;">
      <div class="card-header">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <h2 class="card-title">Not AP Classroom</h2>
      </div>
      <p class="card-text">
        Open an AP Classroom assignment or quiz to hide its answer markers.
      </p>
    </div>

    </div> <!-- End mainView -->

  </div>

  <script src="popup.js"></script>
</body>
</html>
