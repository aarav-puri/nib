<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nib</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div id="mainView">
      <!-- Header with Branding -->
      <header class="header">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div class="brand">
            <svg class="brand-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                <path d="M10 23V9"/>
                <path d="M22 9v14"/>
                <path d="M10 9l12 14" stroke-opacity="0.4"/>
              </g>
              <circle cx="10" cy="9" r="3.2" fill="currentColor"/>
              <circle cx="22" cy="23" r="3.2" fill="currentColor"/>
            </svg>
            <div class="brand-text">
              <h1 class="brand-title">Nib</h1>
            </div>
          </div>
        </div>

      <div class="tool-card" id="hiderCard" style="display: none;">
        <div class="tool-row" style="margin-bottom: 0; gap: 16px;">
          <div class="tool-info" style="flex: 1; min-width: 0;">
            <span class="tool-title">Answer Hider</span>
            <span class="tool-subtitle">Hides correct and incorrect markers</span>
            <span class="tool-note" id="hiderNote" style="display: none;"></span>
          </div>
          <div style="display: flex; align-items: center; gap: 16px; flex-shrink: 0;">
            <label class="toggle">
              <input type="checkbox" id="hiderToggle">
              <span class="toggle-track"></span>
            </label>
            <span class="tool-badge" id="hiderBadge" style="display: none;">Visible</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Error Card -->
    <div class="card card-error" id="errorCard" style="display: none;">
      <div class="card-header">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <h2 class="card-title">Error</h2>
      </div>
      <p class="error-text" id="errorText"></p>
    </div>

    <!-- Not AP Classroom Card -->
    <div class="card card-warning" id="notApCard" style="display: none;">
      <div class="card-header">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <h2 class="card-title">Not AP Classroom</h2>
      </div>
      <p class="card-text">
        Open an AP Classroom assignment or quiz to hide its answer markers.
      </p>
    </div>

    </div> <!-- End mainView -->

  </div>

  <script src="popup.js"></script>
</body>
</html>
